# Site settings
title: Paul Brodner's Blog
description: 'Drawing the lines AI must follow'
url: 'https://paulbrodner.dev'
baseurl: ''
lang: en
disqus_shortname: 'paulbrodner'

author:
  name: 'Paul Brodner'
  email: paul.brodner@gmail.com
  twitter_username: paulbrodner
  facebook_username: paulbrodner
  github_username:  paulbrodner
  linkedin_username:  paulbrodner

defaults:
  - scope:
      path: ''
      type: 'posts'
    values:
      layout: 'post'
  # https://jekyllrb.com/docs/static-files/
  - scope:
      path: "assets/html"
    values:
      html: true

# Build settings
destination: _site
paginate: 5
paginate_path: /page:num
permalink: /:year/:title/
markdown: kramdown
highlighter: rouge

sass:
    sass_dir: _sass
    style: compressed

kramdown:
  # use Github Flavored Markdown
  input: GFM
  # do not replace newlines by <br>s
  hard_wrap: false

plugins: ['jekyll-paginate']

# NOTE: `exclude` REPLACES Jekyll's defaults rather than extending them, so every
# repo-root file that is not listed here gets copied verbatim into _site and served.
exclude:
  - README.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - Rakefile
  - Dockerfile
  - Makefile
  - SEO/
  - script/
  - tests/
  - .travis.yml
  - vendor/
